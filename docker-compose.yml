services:
  app:
    image: ghcr.io/darknesskiller/weddingdb:latest
    ports:
      # Terminate TLS at a reverse proxy on this host.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://weddingdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/weddingdb?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set, e.g. openssl rand -hex 32}"
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:-}"
      STATIC_DIR: "./static"
      # The host reverse proxy reaches the app through the Docker bridge; trust its
      # X-Forwarded-For so rate limits count real clients, not one shared bridge IP.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
      # Opt-in tracing: uncomment + run `docker compose --profile tracing up` to enable.
      # OTEL_ENABLED: true
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Span-event capture (bodies/SQL can contain PII; off by default).
      # OTEL_LOG_BODY: all
      # OTEL_LOG_SQL: all
      TZ: Asia/Kuala_Lumpur
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "./server", "-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # One-shot schema/data migration; the app no longer runs DDL at boot.
  migrate:
    image: ghcr.io/darknesskiller/weddingdb:latest
    command: ["./migrate"]
    environment:
      DATABASE_URL: "postgresql://weddingdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/weddingdb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weddingdb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: weddingdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0
    # Required auth; generate with openssl rand -hex 32.
    command: ["--requirepass=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ulimits:
      memlock: -1
    volumes:
      - redisdata:/data

  jaeger:
    # Pinned: newer Jaeger UI broke the dark theme.
    image: jaegertracing/all-in-one:1.57
    profiles: ["tracing"]
    environment:
      # Badger file storage so traces survive restarts (memory backend wipes them).
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: false
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_SPAN: /badger/state
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    volumes:
      - jgdata:/badger

volumes:
  pgdata:
    name: weddingdb_pgdata
  uploads:
    name: weddingdb_uploads
  redisdata:
    name: weddingdb_redisdata
  jgdata:
    name: weddingdb_jgdata
