services:
  app:
    # Pinned tag, not :latest: a redeploy must run the version you tested.
    image: ghcr.io/darknesskiller/weddingdb:v0.14.6
    ports:
      # Terminate TLS at a reverse proxy on this host.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://weddingdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/weddingdb?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set, e.g. openssl rand -hex 32}"
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:-}"
      # Self-registration at /register is off unless set to "true"; admins create accounts instead.
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-}"
      # Rate limits key on the client IP from X-Forwarded-For. Without this the
      # proxy's own address is used for every request and one client can lock
      # everyone out. A host proxy reaches the published port through this
      # network's gateway (pinned below). Trust only that address: trusting a
      # whole private range lets a client on a 172.16-31.x LAN spoof its IP.
      TRUSTED_PROXIES: "127.0.0.1/32,::1/128,172.30.255.1/32"
      STATIC_DIR: "./static"
      # Opt-in tracing: uncomment + run `docker compose --profile tracing up` to enable.
      # OTEL_ENABLED: true
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Span-event capture (bodies/SQL can contain PII; off by default).
      # OTEL_LOG_BODY: all
      # OTEL_LOG_SQL: all
      TZ: Asia/Kuala_Lumpur
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weddingdb
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: weddingdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Pinned tag, not :latest: Dragonfly's snapshots are not downgrade-safe.
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    # Required auth; generate with openssl rand -hex 32.
    command: ["--requirepass=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ulimits:
      memlock: -1
    volumes:
      - redisdata:/data

  jaeger:
    # Pinned: newer Jaeger UI broke the dark theme.
    image: jaegertracing/all-in-one:1.57
    profiles: ["tracing"]
    environment:
      # Badger file storage so traces survive restarts (memory backend wipes them).
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: false
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_SPAN: /badger/state
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    volumes:
      - jgdata:/badger

volumes:
  pgdata:
    name: weddingdb_pgdata
  uploads:
    name: weddingdb_uploads
  redisdata:
    name: weddingdb_redisdata
  jgdata:
    name: weddingdb_jgdata

networks:
  default:
    ipam:
      # Pinned so TRUSTED_PROXIES can name the gateway (172.30.255.1). Change
      # both together if this range clashes with a network on the host.
      config:
        - subnet: 172.30.255.0/24
