services:
  app:
    image: ghcr.io/darknesskiller/weddingdb:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://weddingdb:weddingdb@postgres:5432/weddingdb?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ADMIN_BOOTSTRAP_PASSWORD: "${ADMIN_BOOTSTRAP_PASSWORD:-}"
      STATIC_DIR: "./static"
      # Opt-in tracing: uncomment + run `docker compose --profile tracing up` to enable.
      # OTEL_ENABLED: "true"
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      # Span-event capture (bodies/SQL can contain PII; off by default).
      # OTEL_LOG_BODY: "all"
      # OTEL_LOG_SQL: "all"
      TZ: Asia/Kuala_Lumpur
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weddingdb
      POSTGRES_PASSWORD: weddingdb
      POSTGRES_DB: weddingdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weddingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"

  jaeger:
    # Pinned: newer Jaeger UI broke the dark theme.
    image: jaegertracing/all-in-one:1.57
    profiles: ["tracing"]
    environment:
      # Badger file storage so traces survive restarts (memory backend wipes them).
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_SPAN: /badger/state
    ports:
      - "16686:16686"
      - "127.0.0.1:4318:4318"
    volumes:
      - jaeger_badger:/badger

volumes:
  pgdata:
    name: weddingdb_pgdata
  uploads:
    name: weddingdb_uploads
  jaeger_badger:
    name: weddingdb_jaeger_badger
